  <path d="M75 20 L245 20 L270 330 L50 330 Z" fill="#7c8581" stroke="#2b2b2b" stroke-width="4"/>
  <circle cx="160" cy="-30" r="28" fill="none" stroke="#555" stroke-width="3" stroke-dasharray="8 6"/>
  <line x1="160" y1="-2" x2="160" y2="20" stroke="#555" stroke-width="3"/>
  <circle cx="45" cy="95" r="12" fill="none" stroke="#555" stroke-width="3"/>
  <circle cx="275" cy="95" r="12" fill="none" stroke="#555" stroke-width="3"/>
  <text x="86" y="375" font-family="Arial" font-size="16">broad readable body mass</text>
</g>

<g transform="translate(470,155)">
