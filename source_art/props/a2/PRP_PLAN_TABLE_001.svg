<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#282C2D"/>
  <text x="44" y="56" fill="#E8E0CF" font-size="32" font-family="sans-serif">PRP_PLAN_TABLE_001 — individual source master</text>
  <text x="44" y="90" fill="#C8B58D" font-size="18" font-family="sans-serif">A-priority shared planning surface · six action-card bays · four physical effort markers · seated/standing readable</text>

  <g font-family="sans-serif">
    <rect x="52" y="130" width="680" height="480" rx="28" fill="#343A3C" stroke="#55717A" stroke-width="7"/>
    <text x="82" y="176" fill="#E8E0CF" font-size="23">TOP VIEW / PLAYER REACH CONTRACT</text>

    <g transform="translate(102 214)">
      <rect x="0" y="0" width="580" height="314" rx="34" fill="#8C7157" stroke="#E8E0CF" stroke-width="9"/>
      <path d="M30 38H550 M30 276H550" stroke="#6B513D" stroke-width="8" opacity=".8"/>

      <g fill="#C8B58D" stroke="#282C2D" stroke-width="5">
        <rect x="35" y="52" width="150" height="88" rx="15"/>
        <rect x="215" y="52" width="150" height="88" rx="15"/>
        <rect x="395" y="52" width="150" height="88" rx="15"/>
        <rect x="35" y="174" width="150" height="88" rx="15"/>
        <rect x="215" y="174" width="150" height="88" rx="15"/>
        <rect x="395" y="174" width="150" height="88" rx="15"/>
      </g>

      <g stroke="#66745C" stroke-width="7" stroke-linecap="round">
        <path d="M72 88h78M72 111h58 M252 88h78M252 111h58 M432 88h78M432 111h58"/>
        <path d="M72 210h78M72 233h58 M252 210h78M252 233h58 M432 210h78M432 233h58"/>
      </g>
      <g fill="#55717A">
        <circle cx="58" cy="77" r="13"/><circle cx="238" cy="77" r="13"/><circle cx="418" cy="77" r="13"/>
      </g>
      <g fill="#66745C">
        <circle cx="58" cy="199" r="13"/><circle cx="238" cy="199" r="13"/><circle cx="418" cy="199" r="13"/>
      </g>

      <rect x="188" y="138" width="204" height="38" rx="18" fill="#3E4544" stroke="#E8E0CF" stroke-width="4"/>
      <circle cx="220" cy="157" r="18" fill="#D59A52" stroke="#282C2D" stroke-width="5"/>
      <circle cx="268" cy="157" r="18" fill="#D59A52" stroke="#282C2D" stroke-width="5"/>
      <path d="M322 136l21 21-21 21-21-21z" fill="#55717A" stroke="#282C2D" stroke-width="5"/>
      <path d="M370 136l21 21-21 21-21-21z" fill="#55717A" stroke="#282C2D" stroke-width="5"/>
      <rect x="252" y="286" width="76" height="28" rx="10" fill="#3E4544" stroke="#D59A52" stroke-width="5"/>
    </g>

    <path d="M116 555 Q390 620 664 555" fill="none" stroke="#D59A52" stroke-width="6" stroke-dasharray="16 12"/>
    <text x="116" y="588" fill="#D59A52" font-size="16">Player A reach side</text>
    <path d="M116 202 Q390 152 664 202" fill="none" stroke="#55717A" stroke-width="6" stroke-dasharray="16 12"/>
    <text x="528" y="204" fill="#8BA2AA" font-size="16">Player B reach side</text>
  </g>

  <g transform="translate(760 130)" font-family="sans-serif">
    <rect width="388" height="480" rx="28" fill="#343A3C" stroke="#66745C" stroke-width="7"/>
    <text x="26" y="46" fill="#E8E0CF" font-size="22">STATE / READABILITY CONTRACT</text>

    <g transform="translate(28 78)">
      <rect width="332" height="92" rx="18" fill="#3E4544" stroke="#55717A" stroke-width="5"/>
      <text x="18" y="29" fill="#E8E0CF" font-size="17">EDITABLE</text>
      <path d="M20 58H128" stroke="#C8B58D" stroke-width="10" stroke-linecap="round"/>
      <path d="M142 49v18h30" fill="none" stroke="#C8B58D" stroke-width="7" stroke-linecap="round"/>
      <text x="180" y="55" fill="#C8B58D" font-size="12">open latch / free marker rail</text>
      <text x="180" y="75" fill="#C8B58D" font-size="12">cards remain movable</text>
    </g>

    <g transform="translate(28 184)">
      <rect width="332" height="92" rx="18" fill="#3E4544" stroke="#D59A52" stroke-width="5"/>
      <text x="18" y="29" fill="#E8E0CF" font-size="17">READY</text>
      <circle cx="55" cy="59" r="15" fill="#D59A52" stroke="#E8E0CF" stroke-width="4"/>
      <path d="M92 46h76M92 61h76" stroke="#D59A52" stroke-width="6" stroke-linecap="round"/>
      <text x="180" y="55" fill="#C8B58D" font-size="12">paired centre alignment cue</text>
      <text x="180" y="75" fill="#C8B58D" font-size="12">still reversible before lock</text>
    </g>

    <g transform="translate(28 290)">
      <rect width="332" height="92" rx="18" fill="#3E4544" stroke="#C8B58D" stroke-width="5"/>
      <text x="18" y="29" fill="#E8E0CF" font-size="17">LOCKED</text>
      <rect x="22" y="45" width="146" height="28" rx="10" fill="#6B513D" stroke="#E8E0CF" stroke-width="4"/>
      <path d="M42 43l108 34M150 43L42 77" stroke="#D59A52" stroke-width="6" stroke-linecap="round"/>
      <text x="180" y="55" fill="#C8B58D" font-size="12">cross-lashed / closed latch</text>
      <text x="180" y="75" fill="#C8B58D" font-size="12">readable in mono / low saturation</text>
    </g>

    <text x="28" y="414" fill="#C8B58D" font-size="15">Approx source target:</text>
    <text x="28" y="437" fill="#E8E0CF" font-size="15">W 1.0–1.3 m × D 0.55–0.75 m</text>
    <text x="28" y="462" fill="#AFA488" font-size="13">No tiny grids, desktop UI density or color-only state.</text>
  </g>

  <text x="52" y="650" fill="#AFA488" font-size="16" font-family="sans-serif">Weathered expedition surface with clean card regions. Four effort markers and 4–6 cards must remain simultaneously legible from either player side.</text>
  <text x="52" y="678" fill="#AFA488" font-size="16" font-family="sans-serif">Source/reference master only. Claude owns final Unity mesh, sockets/snap areas, interaction binding, runtime materials, XR scale and Quest device QA.</text>
</svg>
