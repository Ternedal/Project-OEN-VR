<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#282C2D"/>
  <text x="44" y="56" fill="#E8E0CF" font-size="32" font-family="sans-serif">PRP_HEAVY_CRATE_001 — individual source master</text>
  <text x="44" y="90" fill="#C8B58D" font-size="18" font-family="sans-serif">A-priority shared-object prop · broad opposed handles · closed / placed / open readability · no tiny grip targets</text>

  <g font-family="sans-serif">
    <rect x="52" y="130" width="672" height="480" rx="28" fill="#343A3C" stroke="#55717A" stroke-width="7"/>
    <text x="82" y="176" fill="#E8E0CF" font-size="23">PRIMARY SILHOUETTE / TWO-PERSON CARRY</text>

    <g transform="translate(120 226)">
      <rect x="0" y="0" width="540" height="260" rx="20" fill="#8C7157" stroke="#E8E0CF" stroke-width="9"/>
      <path d="M0 58H540 M92 0V260 M448 0V260" stroke="#6B513D" stroke-width="12" opacity=".85"/>
      <rect x="-32" y="80" width="70" height="100" rx="24" fill="#3E4544" stroke="#D59A52" stroke-width="8"/>
      <rect x="502" y="80" width="70" height="100" rx="24" fill="#3E4544" stroke="#D59A52" stroke-width="8"/>
      <path d="M-9 102v56M549 102v56" stroke="#E8E0CF" stroke-width="11" stroke-linecap="round"/>
      <rect x="212" y="18" width="116" height="42" rx="12" fill="#3E4544" stroke="#C8B58D" stroke-width="6"/>
      <path d="M62 224H478" stroke="#A85E48" stroke-width="12" stroke-linecap="round"/>
    </g>

    <text x="82" y="526" fill="#C8B58D" font-size="15">Opposed side handles sit outside the box silhouette and remain obvious at room scale.</text>
    <text x="82" y="552" fill="#C8B58D" font-size="14">Source fixes silhouette and affordance; carry behaviour remains implementation work.</text>
  </g>

  <g transform="translate(752 130)" font-family="sans-serif">
    <rect width="396" height="480" rx="28" fill="#343A3C" stroke="#66745C" stroke-width="7"/>
    <text x="26" y="46" fill="#E8E0CF" font-size="22">STATE / CONTENT CONTRACT</text>

    <g transform="translate(28 78)">
      <rect width="340" height="102" rx="18" fill="#3E4544" stroke="#55717A" stroke-width="5"/>
      <text x="18" y="28" fill="#E8E0CF" font-size="17">CLOSED</text>
      <rect x="20" y="43" width="128" height="42" rx="10" fill="#8C7157" stroke="#E8E0CF" stroke-width="4"/>
      <path d="M20 56H148" stroke="#6B513D" stroke-width="6"/>
      <rect x="72" y="40" width="28" height="14" rx="5" fill="#3E4544" stroke="#D59A52" stroke-width="3"/>
      <text x="168" y="60" fill="#C8B58D" font-size="13">lid + latch form readable</text>
      <text x="168" y="80" fill="#C8B58D" font-size="13">before interaction</text>
    </g>

    <g transform="translate(28 194)">
      <rect width="340" height="102" rx="18" fill="#3E4544" stroke="#D59A52" stroke-width="5"/>
      <text x="18" y="28" fill="#E8E0CF" font-size="17">PLACED</text>
      <rect x="20" y="43" width="128" height="42" rx="10" fill="#8C7157" stroke="#E8E0CF" stroke-width="4"/>
      <path d="M38 92H132" stroke="#D59A52" stroke-width="7" stroke-linecap="round"/>
      <path d="M56 82v18M114 82v18" stroke="#D59A52" stroke-width="6"/>
      <text x="168" y="60" fill="#C8B58D" font-size="13">stable-ground / release cue</text>
      <text x="168" y="80" fill="#C8B58D" font-size="13">without a new mesh state</text>
    </g>

    <g transform="translate(28 310)">
      <rect width="340" height="118" rx="18" fill="#3E4544" stroke="#C8B58D" stroke-width="5"/>
      <text x="18" y="28" fill="#E8E0CF" font-size="17">OPEN</text>
      <path d="M20 62L58 40H146V62Z" fill="#A98964" stroke="#E8E0CF" stroke-width="4"/>
      <rect x="20" y="62" width="126" height="42" rx="9" fill="#8C7157" stroke="#E8E0CF" stroke-width="4"/>
      <rect x="32" y="70" width="28" height="22" rx="5" fill="#D59A52"/>
      <rect x="68" y="70" width="28" height="22" rx="5" fill="#66745C"/>
      <rect x="104" y="70" width="28" height="22" rx="5" fill="#55717A"/>
      <text x="168" y="58" fill="#C8B58D" font-size="11">starter categories visibly separated</text>
      <text x="168" y="79" fill="#C8B58D" font-size="11">no loose tiny-item clutter</text>
      <text x="168" y="100" fill="#C8B58D" font-size="11">open state obvious by silhouette</text>
    </g>

    <text x="28" y="458" fill="#AFA488" font-size="13">Weathered wood + worn utility metal. No brand identity.</text>
  </g>

  <text x="52" y="650" fill="#AFA488" font-size="16" font-family="sans-serif">Approx source target: W 0.9–1.1 m × D 0.55–0.7 m × H 0.55–0.7 m. Broad handles and lid line must remain readable from room scale.</text>
  <text x="52" y="678" fill="#AFA488" font-size="16" font-family="sans-serif">Source/reference master only. Claude owns final Unity representation, interaction/network binding, scale tuning and Quest device QA.</text>
</svg>
