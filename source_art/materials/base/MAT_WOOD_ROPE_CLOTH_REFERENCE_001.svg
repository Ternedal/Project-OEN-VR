<text x="48" y="58" fill="#E8E0CF" font-size="34" font-family="sans-serif">WOOD · ROPE · CLOTH — source look/state reference</text>
<text x="48" y="94" fill="#C8B58D" font-size="18" font-family="sans-serif">large value/state language for Quest readability · Unity materials/shaders belong to Claude</text>
