<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#282C2D"/>
  <text x="44" y="56" fill="#E8E0CF" font-size="32" font-family="sans-serif">ITM_KNIFE_001 — utility tool source master</text>
  <text x="44" y="90" fill="#C8B58D" font-size="18" font-family="sans-serif">B-priority crafting/fiber tool · blunt sheepsfoot profile · utility language, not weapon language</text>
  <g font-family="sans-serif">
    <rect x="52" y="130" width="520" height="470" rx="28" fill="#343A3C" stroke="#55717A" stroke-width="7"/>
    <text x="82" y="176" fill="#E8E0CF" font-size="23">PRIMARY SILHOUETTE / SCALE</text>
    <path d="M118 300 Q118 264 154 254 L304 254 Q338 258 350 286 L350 344 Q338 372 304 376 L154 376 Q118 366 118 330 Z" fill="#6B513D" stroke="#E8E0CF" stroke-width="8"/>
    <path d="M145 280 H316 M145 314 H322 M145 348 H314" stroke="#D59A52" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
    <circle cx="154" cy="315" r="15" fill="#282C2D" stroke="#C8B58D" stroke-width="6"/>
    <path d="M346 282 L482 276 Q514 282 526 306 L526 318 Q514 337 486 346 L346 346 Z" fill="#A5A39A" stroke="#E8E0CF" stroke-width="8" stroke-linejoin="round"/>
    <path d="M372 336 H486 Q504 330 514 318" fill="none" stroke="#D59A52" stroke-width="7" stroke-linecap="round"/>
    <path d="M346 270 V356" stroke="#3E4544" stroke-width="14" stroke-linecap="round"/>
    <text x="92" y="430" fill="#C8B58D" font-size="18">handle ~12–15 cm</text>
    <text x="330" y="430" fill="#C8B58D" font-size="18">blade ~9–11 cm</text>
    <text x="84" y="482" fill="#E8E0CF" font-size="18">• rounded sheepsfoot nose; no thrusting point</text>
    <text x="84" y="514" fill="#E8E0CF" font-size="18">• broad fiber/crafting edge readable at hand distance</text>
    <text x="84" y="546" fill="#E8E0CF" font-size="18">• oversized grip + stop; lanyard hole aids tool identity</text>
  </g>
  <g transform="translate(620 130)" font-family="sans-serif">
    <rect width="528" height="470" rx="28" fill="#343A3C" stroke="#66745C" stroke-width="7"/>
    <text x="30" y="46" fill="#E8E0CF" font-size="23">INTERACTION / MATERIAL CONTRACT</text>
    <rect x="48" y="92" width="430" height="118" rx="20" fill="#3E4544" stroke="#C8B58D" stroke-width="5"/>
    <text x="76" y="126" fill="#D59A52" font-size="18">CUT / CRAFT ZONE</text>
    <path d="M82 158 H420" stroke="#D59A52" stroke-width="9" stroke-linecap="round"/>
    <text x="76" y="184" fill="#E8E0CF" font-size="14">broad edge; no combat guard or serration</text>
    <text x="76" y="204" fill="#E8E0CF" font-size="14">no tactical markings or aggressive point geometry</text>
    <rect x="48" y="226" width="200" height="122" rx="20" fill="#3A4140" stroke="#55717A" stroke-width="5"/>
    <text x="72" y="260" fill="#E8E0CF" font-size="18">CLEAN / DRY</text>
    <path d="M78 304 H206" stroke="#B8B6AA" stroke-width="20" stroke-linecap="round"/>
    <path d="M84 326 H196" stroke="#6B513D" stroke-width="18" stroke-linecap="round"/>
    <rect x="278" y="226" width="200" height="122" rx="20" fill="#3A4140" stroke="#55717A" stroke-width="5"/>
    <text x="302" y="260" fill="#E8E0CF" font-size="18">WORN / WET</text>
    <path d="M308 304 H436" stroke="#77766F" stroke-width="20" stroke-linecap="round"/>
    <path d="M314 326 H426" stroke="#574838" stroke-width="18" stroke-linecap="round"/>
    <text x="48" y="392" fill="#C8B58D" font-size="17">Material family: worn utility metal + weathered wood/fiber grip.</text>
    <text x="48" y="424" fill="#C8B58D" font-size="17">Gameplay cue is shape + edge placement, never color alone.</text>
  </g>
  <text x="52" y="646" fill="#AFA488" font-size="16" font-family="sans-serif">Source/reference master only. Claude owns final Unity mesh, collider/grab setup, scale tuning, materials and Quest device QA.</text>
  <text x="52" y="674" fill="#AFA488" font-size="16" font-family="sans-serif">Intended fiction: camp utility cutter for fiber/crafting. Avoid combat poses, blood, tactical markings, aggressive point geometry or weapon emphasis.</text>
