<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768"><rect width="1024" height="768" fill="#262A2D"/><text x="48" y="58" fill="#EEE5D4" font-size="34" font-family="sans-serif">B1 — Ridge / weather-scout readability reference</text><text x="48" y="92" fill="#9FB4C1" font-size="18" font-family="sans-serif">Horizon information + signal foresight · not final geometry</text><path d="M65 565 C190 500 280 480 390 500 C485 518 555 455 645 438 C760 415 835 455 965 400" fill="none" stroke="#6F7B70" stroke-width="80" stroke-linecap="round"/><path d="M70 565 C190 505 290 492 390 510 C485 528 555 470 650 450 C755 430 845 468 965 415" fill="none" stroke="#B8B69C" stroke-width="16" stroke-linecap="round"/><rect x="585" y="330" width="245" height="150" rx="32" fill="#44535A" stroke="#A9C0CC" stroke-width="7"/><text x="615" y="370" fill="#EEE5D4" font-size="20" font-family="sans-serif">SAFE OVERLOOK</text><text x="615" y="405" fill="#C8B98E" font-size="17" font-family="sans-serif">weather + horizon read</text><text x="615" y="437" fill="#C8B98E" font-size="17" font-family="sans-serif">no lean over real edge</text><path d="M650 340 L780 160" stroke="#D4A35F" stroke-width="8" stroke-dasharray="14 12"/><polygon points="780,145 795,178 765,178" fill="#D4A35F"/><text x="792" y="155" fill="#F1D6A3" font-size="18" font-family="sans-serif">storm front</text><path d="M730 340 L920 225" stroke="#A85E48" stroke-width="8" stroke-dasharray="14 12"/><polygon points="920,210 935,243 905,243" fill="#A85E48"/><text x="840" y="205" fill="#E5B09D" font-size="18" font-family="sans-serif">signal direction</text><circle cx="210" cy="500" r="24" fill="#D4A35F" stroke="#F5DCA7" stroke-width="6"/><circle cx="400" cy="505" r="20" fill="#9FB4C1" stroke="#E5EFF3" stroke-width="5"/><text x="130" y="548" fill="#EEE5D4" font-size="18" font-family="sans-serif">jungle exit marker</text><text x="340" y="552" fill="#EEE5D4" font-size="18" font-family="sans-serif">wind cue marker</text><rect x="62" y="125" width="330" height="205" rx="16" fill="#1C2023" stroke="#59646B" stroke-width="3"/><text x="82" y="158" fill="#EEE5D4" font-size="19" font-family="sans-serif">Information rules</text><text x="82" y="191" fill="#C8B98E" font-size="17" font-family="sans-serif">• reward with foresight, not exposition</text><text x="82" y="219" fill="#C8B98E" font-size="17" font-family="sans-serif">• weather read is directional + audio</text><text x="82" y="247" fill="#C8B98E" font-size="17" font-family="sans-serif">• signal opportunity becomes legible</text><text x="82" y="275" fill="#C8B98E" font-size="17" font-family="sans-serif">• route back remains obvious</text><text x="82" y="303" fill="#C8B98E" font-size="17" font-family="sans-serif">• no sheer-edge interaction requirement</text></svg>
