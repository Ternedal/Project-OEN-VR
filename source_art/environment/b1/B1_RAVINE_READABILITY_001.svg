<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768"><rect width="1024" height="768" fill="#25282B"/><text x="48" y="58" fill="#EEE5D4" font-size="34" font-family="sans-serif">B1 — Ravine rescue readability reference</text><text x="48" y="92" fill="#9FB3B8" font-size="18" font-family="sans-serif">Bounded traversal + active belayer role · not final geometry</text><path d="M370 125 C325 245 330 360 360 455 C385 535 365 630 330 705" fill="none" stroke="#121518" stroke-width="135" stroke-linecap="round"/><path d="M690 115 C735 245 735 365 695 470 C670 545 690 625 725 705" fill="none" stroke="#121518" stroke-width="135" stroke-linecap="round"/><path d="M410 150 C385 265 392 372 415 455 C433 520 418 605 395 682" fill="none" stroke="#69757A" stroke-width="16"/><path d="M650 145 C677 265 675 370 652 455 C635 530 648 610 670 682" fill="none" stroke="#69757A" stroke-width="16"/><rect x="90" y="470" width="230" height="150" rx="28" fill="#46564C" stroke="#AFC29D" stroke-width="7"/><text x="112" y="505" fill="#EEE5D4" font-size="20" font-family="sans-serif">BELAYER PLATFORM</text><text x="112" y="540" fill="#C8B98E" font-size="17" font-family="sans-serif">safe stance + tension read</text><circle cx="335" cy="500" r="22" fill="#D4A35F" stroke="#F5DCA7" stroke-width="6"/><text x="175" y="655" fill="#D4A35F" font-size="18" font-family="sans-serif">ANCHOR</text><g fill="#B7C4CA" stroke="#EEF3F5" stroke-width="5"><circle cx="475" cy="460" r="22"/><circle cx="540" cy="390" r="22"/><circle cx="600" cy="315" r="22"/></g><path d="M335 500 Q420 490 475 460 Q520 430 540 390 Q565 350 600 315" fill="none" stroke="#D4A35F" stroke-width="9"/><g fill="#A85E48" stroke="#E9B09D" stroke-width="5"><polygon points="467,422 483,442 451,442"/><polygon points="532,352 548,372 516,372"/><polygon points="592,277 608,297 576,297"/></g><rect x="690" y="230" width="245" height="160" rx="28" fill="#4E5649" stroke="#AFC29D" stroke-width="7"/><text x="714" y="268" fill="#EEE5D4" font-size="20" font-family="sans-serif">RECOVERY LEDGE</text><text x="714" y="302" fill="#C8B98E" font-size="17" font-family="sans-serif">objective visible early</text><text x="714" y="332" fill="#C8B98E" font-size="17" font-family="sans-serif">safe pause / resolve point</text><path d="M705 415 C755 460 790 520 825 585" fill="none" stroke="#55717A" stroke-width="14" stroke-dasharray="16 12"/><text x="735" y="625" fill="#9FB3B8" font-size="18" font-family="sans-serif">fail-forward return route</text><rect x="62" y="122" width="310" height="205" rx="16" fill="#1C2023" stroke="#59646B" stroke-width="3"/><text x="82" y="155" fill="#EEE5D4" font-size="19" font-family="sans-serif">Comfort / role rules</text><text x="82" y="188" fill="#C8B98E" font-size="17" font-family="sans-serif">• 2–4 bounded progression points</text><text x="82" y="216" fill="#C8B98E" font-size="17" font-family="sans-serif">• no required real-world climbing</text><text x="82" y="244" fill="#C8B98E" font-size="17" font-family="sans-serif">• belayer sees tension + route order</text><text x="82" y="272" fill="#C8B98E" font-size="17" font-family="sans-serif">• traverser sees local holds</text><text x="82" y="300" fill="#C8B98E" font-size="17" font-family="sans-serif">• ordinary mistake never full-restarts</text></svg>
