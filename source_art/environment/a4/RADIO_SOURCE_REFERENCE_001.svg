<g transform="translate(590 160)" font-family="sans-serif">
<text x="0" y="18" fill="#E8E0CF" font-size="24">STATE LANGUAGE</text>
<text x="0" y="78" fill="#E8E0CF" font-size="19">DEAD — dark display, no pulse, heavy silence</text>
<text x="0" y="126" fill="#E8E0CF" font-size="19">WEAK — intermittent amber tick + unstable audio</text>
<text x="0" y="174" fill="#E8E0CF" font-size="19">ACTIVE — steady signal rhythm + readable display</text>
<text x="0" y="242" fill="#C8B58D" font-size="18">Grip/readability:</text>
<text x="0" y="282" fill="#E8E0CF" font-size="18">• oversized dial / handle language</text>
<text x="0" y="318" fill="#E8E0CF" font-size="18">• removable power source has keyed socket</text>
<text x="0" y="354" fill="#E8E0CF" font-size="18">• no real brand, military model or modern sci-fi UI</text>
<text x="0" y="408" fill="#AFA488" font-size="17">Claude owns interaction, audio binding, material and runtime state.</text>
</g>
