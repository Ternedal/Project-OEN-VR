name: Audio Source Probe

on:
  pull_request:
    paths:
      - 'tools/probe_public_domain_source.py'
      - '.github/workflows/audio-source-probe.yml'

permissions:
  contents: read

jobs:
  probe-tonitrus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe verified Public Domain Tonitrus original
        run: >-
          python tools/probe_public_domain_source.py
          https://upload.wikimedia.org/wikipedia/commons/c/c8/Tonitrus.ogg
