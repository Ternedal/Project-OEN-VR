name: Generate Project OEN runtime art

on:
  push:
    branches:
      - agent/complete-unity-graphics-v1
    paths:
      - 'tools/generated_art/**'
      - 'src/unity/ProjectOen.Art/**'
      - 'prototype/m0b-bootstrap/**'
      - 'docs/36_GENERATED_ART_PACK.md'
      - '.github/workflows/generate-project-oen-art.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse production-art PowerShell entrypoints
        shell: pwsh
        run: |
          $files = @(
            'prototype/m0b-bootstrap/Bootstrap-M0b.ps1',
            'prototype/m0b-bootstrap/Review-ProductionArt.ps1'
          )
          $failed = $false
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host "PowerShell parse errors in $file" -ForegroundColor Red
              $errors | ForEach-Object { Write-Host ("  " + $_.Message) -ForegroundColor Red }
              $failed = $true
            } else {
              Write-Host "PASS: $file"
            }
          }
          if ($failed) { exit 1 }
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Generate compact runtime sprites
        run: python tools/generated_art/generate_runtime_sprites.py
      - name: Import production-art source payload when requested
        run: python tools/generated_art/import_production_art_payload.py
      - name: Generate full production art
        run: python tools/generated_art/generate_production_art.py
      - name: Refine shared Quest-friendly materials
        run: python tools/generated_art/refine_material_textures.py
      - name: Refine Stormnatten hero world assets
        run: python tools/generated_art/refine_hero_art.py
      - name: Add readable hero joinery
        run: python tools/generated_art/refine_hero_joinery.py
      - name: Refine Stormnatten environment world assets
        run: python tools/generated_art/refine_environment_art.py
      - name: Refine survival and tool prop world assets
        run: python tools/generated_art/refine_prop_art.py
      - name: Refine remaining set dressing and decal assets
        run: python tools/generated_art/refine_set_dressing_art.py
      - name: Validate full production art
        run: python tools/generated_art/validate_production_art.py
      - name: Validate refined materials
        run: python tools/generated_art/validate_material_textures.py
      - name: Validate hero-art refinement
        run: python tools/generated_art/validate_hero_art.py
      - name: Validate environment-art refinement
        run: python tools/generated_art/validate_environment_art.py
      - name: Validate survival/tool prop refinement
        run: python tools/generated_art/validate_prop_art.py
      - name: Validate remaining set dressing and decals
        run: python tools/generated_art/validate_set_dressing_art.py
      - name: Validate enriched Stormnatten showcase coverage
        run: python tools/generated_art/validate_showcase_content.py
      - name: Validate Unity production-art wiring
        run: python tools/generated_art/validate_unity_art_builder.py
      - name: Commit generated and production assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/ProjectOEN/GeneratedArtRuntime256 Assets/ProjectOEN/GeneratedArtRuntime256Docs
          git add Assets/ProjectOEN/ProductionArt
          git add -A tools/generated_art/generate_production_art.py 2>/dev/null || true
          git add -A tools/generated_art/refine_material_textures.py 2>/dev/null || true
          git add -A tools/generated_art/refine_hero_art.py 2>/dev/null || true
          git add -A tools/generated_art/refine_hero_joinery.py 2>/dev/null || true
          git add -A tools/generated_art/refine_environment_art.py 2>/dev/null || true
          git add -A tools/generated_art/refine_prop_art.py 2>/dev/null || true
          git add -A tools/generated_art/refine_set_dressing_art.py 2>/dev/null || true
          git add -A tools/generated_art/validate_material_textures.py 2>/dev/null || true
          git add -A tools/generated_art/validate_hero_art.py 2>/dev/null || true
          git add -A tools/generated_art/validate_environment_art.py 2>/dev/null || true
          git add -A tools/generated_art/validate_prop_art.py 2>/dev/null || true
          git add -A tools/generated_art/validate_set_dressing_art.py 2>/dev/null || true
          git add -A tools/generated_art/validate_showcase_content.py 2>/dev/null || true
          git add -A tools/generated_art/validate_unity_art_builder.py 2>/dev/null || true
          git add -A art_payloads 2>/dev/null || true
          git add -A tools/generated_art/import_trigger.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No generated or production art changes.'
            exit 0
          fi
          git commit -m 'Generate refined Project OEN production art'
          git push origin HEAD:${{ github.ref_name }}
