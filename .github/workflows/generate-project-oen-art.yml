name: Generate Project OEN runtime art

on:
  push:
    branches:
      - agent/complete-unity-graphics-v1
    paths:
      - 'tools/generated_art/**'
      - '.github/workflows/generate-project-oen-art.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Generate separate Unity PNG sprites
        run: python tools/generated_art/generate_runtime_sprites.py
      - name: Commit generated assets
        shell: bash
        run: |
          if git diff --quiet -- Assets/ProjectOEN/GeneratedArtRuntime256 Assets/ProjectOEN/GeneratedArtRuntime256Docs; then
            echo 'No generated art changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/ProjectOEN/GeneratedArtRuntime256 Assets/ProjectOEN/GeneratedArtRuntime256Docs
          git commit -m 'Generate Project OEN Unity runtime graphics'
          git push origin HEAD:${{ github.ref_name }}
