name: Generate Project OEN runtime art

on:
  push:
    branches:
      - agent/complete-unity-graphics-v1
    paths:
      - 'tools/generated_art/**'
      - '.github/workflows/generate-project-oen-art.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Generate compact runtime sprites
        run: python tools/generated_art/generate_runtime_sprites.py
      - name: Import production-art source payload when requested
        run: python tools/generated_art/import_production_art_payload.py
      - name: Generate full production art
        shell: bash
        run: |
          if [ -f tools/generated_art/generate_production_art.py ]; then
            python tools/generated_art/generate_production_art.py
          else
            echo 'Production-art generator not present yet.'
          fi
      - name: Commit generated and production assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/ProjectOEN/GeneratedArtRuntime256 Assets/ProjectOEN/GeneratedArtRuntime256Docs
          if [ -d Assets/ProjectOEN/ProductionArt ]; then
            git add Assets/ProjectOEN/ProductionArt
          fi
          git add -A tools/generated_art/generate_production_art.py 2>/dev/null || true
          git add -A art_payloads 2>/dev/null || true
          git add -A tools/generated_art/import_trigger.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No generated or production art changes.'
            exit 0
          fi
          git commit -m 'Generate Project OEN production art'
          git push origin HEAD:${{ github.ref_name }}
