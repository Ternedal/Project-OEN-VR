name: Validate non-Unity sources

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'source_art/**'
      - 'docs/38_SOURCE_ASSET_MANIFEST.md'
      - 'docs/39_AUDIO_CUE_MANIFEST.md'
      - 'tools/validate_non_unity_sources.py'
      - 'tools/validate_planning_status_ui.py'
      - 'tools/validate_ember_carrier_source.py'
      - 'tools/test_validate_ember_carrier_source.py'
      - 'tools/validate_repair_mallet_source.py'
      - 'tools/test_validate_repair_mallet_source.py'
      - 'tools/validate_storm_finale_contract.py'
      - 'tools/validate_camp_source_meshes.py'
      - '.github/workflows/non-unity-source-validation.yml'
  pull_request:
    paths:
      - 'content/**'
      - 'source_art/**'
      - 'docs/38_SOURCE_ASSET_MANIFEST.md'
      - 'docs/39_AUDIO_CUE_MANIFEST.md'
      - 'tools/validate_non_unity_sources.py'
      - 'tools/validate_planning_status_ui.py'
      - 'tools/validate_ember_carrier_source.py'
      - 'tools/test_validate_ember_carrier_source.py'
      - 'tools/validate_repair_mallet_source.py'
      - 'tools/test_validate_repair_mallet_source.py'
      - 'tools/validate_storm_finale_contract.py'
      - 'tools/validate_camp_source_meshes.py'
      - '.github/workflows/non-unity-source-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate non-Unity source contracts
        run: python tools/validate_non_unity_sources.py
      - name: Validate planning/status UI links
        run: python tools/validate_planning_status_ui.py
      - name: Test ember carrier source
        run: python tools/test_validate_ember_carrier_source.py
      - name: Validate ember carrier source
        run: python tools/validate_ember_carrier_source.py
      - name: Test repair mallet source
        run: python tools/test_validate_repair_mallet_source.py
      - name: Validate repair mallet source
        run: python tools/validate_repair_mallet_source.py
      - name: Validate Storm finale contract
        run: python tools/validate_storm_finale_contract.py
      - name: Validate Camp source meshes
        run: python tools/validate_camp_source_meshes.py
