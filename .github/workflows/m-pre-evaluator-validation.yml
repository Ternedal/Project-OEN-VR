name: Validate M-Pre evaluator

on:
  push:
    paths:
      - 'tools/evaluate_mpre.py'
      - 'tools/test_evaluate_mpre.py'
      - 'tools/test_mpre_facilitator_runner.py'
      - 'prototype/m-pre/**'
      - '.github/workflows/m-pre-evaluator-validation.yml'
  pull_request:
    paths:
      - 'tools/evaluate_mpre.py'
      - 'tools/test_evaluate_mpre.py'
      - 'tools/test_mpre_facilitator_runner.py'
      - 'prototype/m-pre/**'
      - '.github/workflows/m-pre-evaluator-validation.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run M-Pre code and contract QA
        run: python -m unittest discover -s tools -p 'test_*mpre*.py' -v
