name: Validate Foley human review and source approval

on:
  pull_request:
    paths:
      - 'content/audio/foley_session_contract.source.json'
      - 'content/audio/foley_human_review_contract.source.json'
      - 'content/audio/foley_source_materialization_contract.source.json'
      - 'content/audio/listening_qa.source.json'
      - 'tools/foley_human_review_support.py'
      - 'tools/prepare_foley_human_review.py'
      - 'tools/normalize_foley_human_review.py'
      - 'tools/materialize_foley_source_approved.py'
      - 'tools/test_foley_human_review.py'
      - 'tools/validate_foley_human_review_contract.py'
      - 'docs/75_FOLEY_HUMAN_REVIEW_AND_SOURCE_APPROVAL.md'
      - '.github/workflows/foley-human-review-validation.yml'
  push:
    branches: [main]
    paths:
      - 'content/audio/foley_session_contract.source.json'
      - 'content/audio/foley_human_review_contract.source.json'
      - 'content/audio/foley_source_materialization_contract.source.json'
      - 'content/audio/listening_qa.source.json'
      - 'tools/foley_human_review_support.py'
      - 'tools/prepare_foley_human_review.py'
      - 'tools/normalize_foley_human_review.py'
      - 'tools/materialize_foley_source_approved.py'
      - 'tools/test_foley_human_review.py'
      - 'tools/validate_foley_human_review_contract.py'
      - 'docs/75_FOLEY_HUMAN_REVIEW_AND_SOURCE_APPROVAL.md'
      - '.github/workflows/foley-human-review-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Foley review tooling
        run: >-
          python -m py_compile
          tools/foley_human_review_support.py
          tools/prepare_foley_human_review.py
          tools/normalize_foley_human_review.py
          tools/materialize_foley_source_approved.py
          tools/test_foley_human_review.py
          tools/validate_foley_human_review_contract.py
      - name: Validate live Foley review contract
        run: python tools/validate_foley_human_review_contract.py
      - name: Test positive, negative and tamper evidence paths
        run: python tools/test_foley_human_review.py
