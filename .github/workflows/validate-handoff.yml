name: Validate handoff

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: pip install -r tools/requirements-validation.txt
      - name: Validate repository payload
        run: python tools/validate_handoff.py
