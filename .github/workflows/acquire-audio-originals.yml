name: Acquire audio originals

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/acquire-audio-originals.yml'

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Acquire direct CC0 originals
        run: python tools/acquire_audio_sources.py --all-direct --timeout 120

      - name: Show acquisition manifest
        run: cat PrivateContent/AudioSourceIncoming/acquisition_manifest.json

      - name: Upload acquired originals and manifest
        uses: actions/upload-artifact@v4
        with:
          name: oen-audio-originals
          path: PrivateContent/AudioSourceIncoming/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
