name: Acquire audio originals

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/acquire-audio-originals.yml'
      - 'tools/acquire_audio_sources.py'
      - 'tools/validate_audio_canonical_acquisition.py'
      - 'tools/validate_audio_extension_acquisition.py'
      - 'tools/validate_audio_field_backlog_acquisition.py'
      - 'content/audio/acquisition_candidates.source.json'
      - 'content/audio/acquisition_candidates.direct_extension.source.json'
      - 'content/audio/acquisition_candidates.field_backlog.source.json'
      - 'content/audio/acquisition_receipt.source.json'
      - 'content/audio/acquisition_extension_receipt.source.json'
      - 'content/audio/acquisition_extension_member_shortlist.source.json'
      - 'content/audio/acquisition_field_backlog_receipt.source.json'

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install technical audio probe
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffprobe -version | head -n 1

      - name: Acquire canonical direct originals
        run: >-
          python tools/acquire_audio_sources.py
          --candidate-source content/audio/acquisition_candidates.source.json
          --all-direct --timeout 120
          --output PrivateContent/AudioSourceIncoming

      - name: Verify pinned canonical source integrity
        run: >-
          python tools/validate_audio_canonical_acquisition.py
          --root PrivateContent/AudioSourceIncoming

      - name: Acquire verified direct extension sources
        run: >-
          python tools/acquire_audio_sources.py
          --candidate-source content/audio/acquisition_candidates.direct_extension.source.json
          --all-direct --timeout 120
          --output PrivateContent/AudioSourceExtension

      - name: Verify pinned extension source integrity
        run: >-
          python tools/validate_audio_extension_acquisition.py
          --root PrivateContent/AudioSourceExtension

      - name: Acquire field-backlog candidates
        run: >-
          python tools/acquire_audio_sources.py
          --candidate-source content/audio/acquisition_candidates.field_backlog.source.json
          --all-direct --timeout 120
          --output PrivateContent/AudioFieldBacklog

      - name: Verify pinned field-backlog source integrity
        run: >-
          python tools/validate_audio_field_backlog_acquisition.py
          --root PrivateContent/AudioFieldBacklog

      - name: Show acquisition manifests
        run: |
          echo '--- canonical ---'
          cat PrivateContent/AudioSourceIncoming/acquisition_manifest.json
          echo '--- direct extension ---'
          cat PrivateContent/AudioSourceExtension/acquisition_manifest.json
          echo '--- field backlog ---'
          cat PrivateContent/AudioFieldBacklog/acquisition_manifest.json

      - name: Upload acquired originals and manifests
        uses: actions/upload-artifact@v4
        with:
          name: oen-audio-direct-acquisition
          path: |
            PrivateContent/AudioSourceIncoming/
            PrivateContent/AudioSourceExtension/
            PrivateContent/AudioFieldBacklog/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
