name: Validate event presentation source

on:
  push:
    branches: [main]
    paths:
      - 'content/events/stormnatten.events.source.json'
      - 'content/events/stormnatten.presentation.source.json'
      - 'source_art/events/b2/**'
      - 'tools/validate_event_presentation_source.py'
      - '.github/workflows/event-presentation-validation.yml'
  pull_request:
    paths:
      - 'content/events/stormnatten.events.source.json'
      - 'content/events/stormnatten.presentation.source.json'
      - 'source_art/events/b2/**'
      - 'tools/validate_event_presentation_source.py'
      - '.github/workflows/event-presentation-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate event presentation source
        run: python tools/validate_event_presentation_source.py
