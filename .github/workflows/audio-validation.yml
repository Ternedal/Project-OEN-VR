name: Audio Validation

on:
  pull_request:
    paths:
      - 'content/audio/**'
      - 'src/unity/ProjectOen.Audio/**'
      - 'tools/validate_audio_manifest.py'
      - '.github/workflows/audio-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'content/audio/**'
      - 'src/unity/ProjectOen.Audio/**'
      - 'tools/validate_audio_manifest.py'
      - '.github/workflows/audio-validation.yml'

permissions:
  contents: read

jobs:
  validate-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate audio manifest and runtime IDs
        run: python tools/validate_audio_manifest.py
