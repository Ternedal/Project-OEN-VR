name: Validate source inventory

on:
  push:
    branches: [main]
    paths:
      - 'content/source_inventory.source.json'
      - 'source_art/**'
      - 'content/**'
      - 'tools/validate_source_inventory.py'
      - '.github/workflows/source-inventory-validation.yml'
  pull_request:
    paths:
      - 'content/source_inventory.source.json'
      - 'source_art/**'
      - 'content/**'
      - 'tools/validate_source_inventory.py'
      - '.github/workflows/source-inventory-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source inventory
        run: python tools/validate_source_inventory.py
