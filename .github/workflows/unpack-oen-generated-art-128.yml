name: Unpack Project OEN generated art 128

on:
  push:
    branches:
      - agent/unity-graphics-assets
    paths:
      - 'tools/oen_parts128/part-043.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack-generated-art:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout asset branch
        uses: actions/checkout@v4
        with:
          ref: agent/unity-graphics-assets
          fetch-depth: 0

      - name: Assemble, verify and unpack PNG assets
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/oen_parts128/part-043.txt
          cat tools/oen_parts128/part-*.txt > /tmp/oen_generated128.tar.gz.b64
          base64 --decode /tmp/oen_generated128.tar.gz.b64 > /tmp/oen_generated128.tar.gz
          echo '28fbd0e23bd3fc2fcb158d40ece40c9f8d22823fbb69310089a911fe1506585e  /tmp/oen_generated128.tar.gz' | sha256sum -c -
          tar -xzf /tmp/oen_generated128.tar.gz -C .
          rm -rf tools/oen_parts128

      - name: Commit individual Unity PNG assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A Assets/ProjectOEN tools/oen_parts128 || true
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Add Project OEN generated Unity PNG assets (128px seed)'
          git push origin HEAD:agent/unity-graphics-assets
