name: Validate field audio backlog coverage

on:
  push:
    branches: [main]
    paths:
      - 'content/audio/field_backlog_coverage.source.json'
      - 'content/audio/acquisition_receipt.source.json'
      - 'content/audio/acquisition_field_backlog_receipt.source.json'
      - 'tools/validate_field_backlog_coverage.py'
      - '.github/workflows/field-backlog-validation.yml'
  pull_request:
    paths:
      - 'content/audio/field_backlog_coverage.source.json'
      - 'content/audio/acquisition_receipt.source.json'
      - 'content/audio/acquisition_field_backlog_receipt.source.json'
      - 'tools/validate_field_backlog_coverage.py'
      - '.github/workflows/field-backlog-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate field source coverage and receipt bindings
        run: python tools/validate_field_backlog_coverage.py
